[workspace]
resolver = "2"
members = ["crates/tscad-wasm"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Tests run the kernel optimised but without the slow whole-program LTO.
[profile.test]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2

# Faster wasm builds for development (`bun scripts/build-wasm.ts --dev`).
[profile.wasm-dev]
inherits = "release"
lto = false
codegen-units = 16

# Size-optimised wasm (compare with release: `cargo build --profile wasm-small`).
[profile.wasm-small]
inherits = "release"
opt-level = "s"
