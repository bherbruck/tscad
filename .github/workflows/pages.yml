name: Playground

# Builds the release wasm, the static playground (dist/playground) and the docs site
# (dist/site, with the playground at play/), and deploys dist/site to
# GitHub Pages. Enable Pages with "Source: GitHub Actions" in the repo settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130,wasm-opt
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build wasm (release)
        run: bun scripts/build-wasm.ts --ci
      - name: Build playground
        run: bun scripts/build-playground.ts
      - name: Smoke-test the static build
        run: bun test tests/app.playground.test.ts
      # The site root is dist/site (docs); the playground is mounted at play/ by build-docs.
      - name: Build docs site
        run: |
          if [ -f scripts/build-docs.ts ]; then
            bun scripts/build-docs.ts
          else
            mkdir -p dist/site && cp -r dist/playground dist/site/play
            printf '<!doctype html><meta http-equiv="refresh" content="0; url=play/">' > dist/site/index.html
            touch dist/site/.nojekyll
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
