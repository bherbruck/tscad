[package]
name = "tscad-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "e7627f7f18176460ad4fb64fd1376fd66e1fe3b3" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore", rev = "e7627f7f18176460ad4fb64fd1376fd66e1fe3b3" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "e7627f7f18176460ad4fb64fd1376fd66e1fe3b3" }
solidcore-step = { git = "https://github.com/tangency-labs/solidcore", rev = "e7627f7f18176460ad4fb64fd1376fd66e1fe3b3" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "e7627f7f18176460ad4fb64fd1376fd66e1fe3b3" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcore", rev = "e7627f7f18176460ad4fb64fd1376fd66e1fe3b3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

[features]
# solidcore's profiler (scopes and counters, JSON Lines) for kernel performance work.
profile = ["solidcore/profile"]
